# Frontend CI (P0-12, P12 §132/§133).
#
# Runs on every pull request and on pushes to main so the required check always
# has a run. The first `npm ci` is the GBP-126 lock-sync check: `npm ci` aborts
# when package-lock.json is out of sync with package.json, so a drifted lock file
# fails the build instead of being silently re-resolved.
name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: Frontend (lock sync, lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---- lock-sync check (GAP-126) ------------------------------------ #
      # npm ci is the check itself: it fails with EUSAGE when package-lock.json
      # is missing a version that package.json/dependencies resolve to. The
      # lock file was repaired once already; this step keeps it enforced.
      - name: Verify lock file is in sync (npm ci)
        run: npm ci --no-audit --no-fund

      # ---- lint (§132 static analysis) ---------------------------------- #
      - name: Lint
        run: npm run lint

      # ---- types --------------------------------------------------------- #
      # `npm run type-check` = `tsc --noEmit` (the repository's own script),
      # verified to exit 0 against the current sources.
      - name: Type check
        run: npm run type-check

      # ---- tests --------------------------------------------------------- #
      - name: Unit tests
        run: npm test

      # ---- build (§133 frontend build failure) --------------------------- #
      - name: Build
        run: npm run build
