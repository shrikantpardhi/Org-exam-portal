# Secret scan (P0-13, GAP-010).
#
# Runs gitleaks, an open-source secret scanner, over the full history plus the
# incoming change. A committed secret is an immediate failure, which is exactly
# the rule in CONTRIBUTING.md ("Run the secret scan in CI; a committed secret is
# an immediate failure").
#
# Gitleaks needs the full history, not just the last commit, to find a key that
# was committed and later removed — removing it from HEAD does not undo the leak.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: re-scan the full history so a secret introduced outside a
    # pull request is still found and revoked.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
