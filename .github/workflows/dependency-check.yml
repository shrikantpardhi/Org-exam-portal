# Dependency check (P0-13, GAP-010, P12 §133).
#
# Two complementary jobs:
#   - `backend`: OWASP Dependency Check against the Maven dependency graph of the
#     backend, failing on a *critical* (CVSS >= 9) finding per P12 §133.
#   - `frontend`: `npm audit` at the high threshold, the direct equivalent of a
#     CVE scan for the npm tree and effectively free on every run.
#
# The scan is ALSO run on a weekly schedule so that a vulnerability disclosed in
# an already-merged dependency is reported without a new pull request.
#
# Deliberately non-blocking by *not* being a required branch-protection check:
# Dependency Check depends on the NVD feed, which is throttled and flaky without
# an API key, so a transient feed outage must never block a code change; a real
# critical finding still fails the job itself (see the check name in the report).
name: dependency-check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependency-check:
    name: Backend dependency check (OWASP Dependency Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve Maven dependencies
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests dependency:go-offline

      - name: OWASP Dependency Check
        # Optional but strongly recommended: an NVD_API_KEY secret removes the
        # NVD throttling and keeps the scan from re-downloading the full feed.
        uses: dependency-check/Dependency-Check-Action@v5
        with:
          path: backend
          project: exam-platform-backend
          format: 'HTML'
          failBuildOnCVSS: 9
          # Optional secret, not a required one: the job still runs without it.
          nvdApiKey: ${{ secrets.NVD_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report.html
          if-no-files-found: warn
          retention-days: 30

  frontend-dependency-check:
    name: Frontend dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit for high or critical advisories
        run: npm audit --audit-level=high
