# ---------------------------------------------------------------------------
# Nginx edge (specs/09-P0-Foundation-V1.5.md section 54).
#
# The edge owns exactly three concerns: frontend routing, API routing, and the
# transport-level request concerns (correlation, size limits, proxy headers).
# Business routing decisions deliberately do NOT live here, and no static
# mapping exposes uploads, application configuration, environment files,
# database files or logs (start section 55).
#
# Request flow:  client -> nginx -> {frontend:3000, backend:8080}
# PgBouncer is not on this path; it sits between the backend and PostgreSQL.
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access log; request_id is emitted by the application too, so an
    # edge log line and an application log line can be correlated.
    log_format structured escape=json
        '{"timestamp":"$time_iso8601","requestId":"$request_id_final","remoteAddr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"upstreamStatus":"$upstream_status","requestTime":$request_time,"bytes":$body_bytes_sent}';
    access_log /var/log/nginx/access.log structured;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Do not advertise the Nginx version.
    server_tokens off;

    # -----------------------------------------------------------------------
    # Request size limits (section 54). The application independently bounds an
    # upload (25 MB file / 30 MB request), so these are the outer envelope.
    # -----------------------------------------------------------------------
    client_max_body_size 30m;
    client_body_buffer_size 128k;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # -----------------------------------------------------------------------
    # Request correlation (section 16).
    #
    # A caller-supplied X-Request-Id is propagated so a client can correlate its
    # own trace. When the client sends none, Nginx generates one. The value is
    # not trusted as a security identity by either tier: the application
    # re-validates it against a strictly bounded pattern and replaces it when it
    # does not match.
    # -----------------------------------------------------------------------
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    # -----------------------------------------------------------------------
    # Proxy defaults
    # -----------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-Id $request_id_final;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;

    # Response hardening (GAP-137, specs/21-P12 §26). These are the edge's contribution to the
    # header policy. The backend sets the same three where it can and they are compatible: the
    # CSP and Referrer-Policy values agree, and HSTS is only meaningful over TLS so it is added
    # on the TLS listener rather than here (see the commented block at the end of this file).
    #
    # `always` matters: a 4xx/5xx response that omits the policy would let an error page become
    # an injection surface.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The edge serves two different things: the Next.js UI (needs its own script/style origins)
    # and the JSON API (needs nothing). One policy covers both, so it is the union that is still
    # safe — no external script origin, no framing, no form escape, no base-uri override.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    upstream backend_upstream {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------- edge liveness
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---------------------------------------------------------------- backend health
        # The readiness route the verification script uses. It is intentionally the
        # only actuator surface reachable through the edge: metrics and the wider
        # actuator tree stay internal (see the deny block below).
        location = /health {
            access_log off;
            proxy_pass http://backend_upstream/actuator/health;
        }

        location = /health/readiness {
            access_log off;
            proxy_pass http://backend_upstream/actuator/health/readiness;
        }

        location = /health/liveness {
            access_log off;
            proxy_pass http://backend_upstream/actuator/health/liveness;
        }

        # ---------------------------------------------------------------- API routing
        # The path is preserved, so /api/v1/... reaches the identical route on the
        # backend and the API contract is untouched.
        location /api/ {
            proxy_pass http://backend_upstream;
        }

        # ---------------------------------------------------------------- not exposed
        # Nginx never becomes a second, unchecked door into the application
        # (section 55). These return 404 rather than proxying.
        location /actuator/ {
            return 404;
        }

        location /v3/api-docs {
            return 404;
        }

        location = /swagger-ui.html {
            return 404;
        }

        # No static mapping may expose uploads, application configuration, or logs.
        location ~ ^/(uploads|data|logs)(/|$) {
            return 404;
        }

        location ~ /\.(env|git) {
            return 404;
        }

        location ~* \.(ya?ml|properties|sql|log)$ {
            return 404;
        }

        # ---------------------------------------------------------------- frontend routing
        location / {
            proxy_pass http://frontend_upstream;
        }
    }

    # -----------------------------------------------------------------------
    # TLS listener (section 54 / P0-10 / specs/21-P12 §27).
    #
    # Production requires HTTPS. The platform must not ship a private key, and
    # Nginx refuses to start when a configured certificate is absent, so this
    # block is inert until an operator mounts a real certificate pair at
    # infrastructure/nginx/certs/{tls.crt,tls.key} and enables it. See
    # infrastructure/nginx/certs/README.md.
    #
    # The header set is repeated here in full, not inherited: Nginx only inherits
    # add_header from the enclosing http block when the server block declares no
    # add_header of its own. Adding HSTS alone would silently drop the CSP and the
    # other policies on the TLS listener — exactly where they matter most.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/tls.crt;
    #     ssl_certificate_key /etc/nginx/certs/tls.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_prefer_server_ciphers off;
    #
    #     # HSTS is only emitted here, never on the plaintext listener: the header over plain
    #     # HTTP is ignored by browsers and would only train operators to ignore warnings.
    #     # includeSubDomains requires every subdomain to be HTTPS-capable — confirm that before
    #     # enabling this in production.
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
    #     add_header Referrer-Policy strict-origin-when-cross-origin always;
    #     add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    #     add_header X-Permitted-Cross-Domain-Policies none always;
    #     add_header Cross-Origin-Opener-Policy same-origin always;
    #
    #     location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
    #     location = /health { access_log off; proxy_pass http://backend_upstream/actuator/health; }
    #     location = /health/readiness { access_log off; proxy_pass http://backend_upstream/actuator/health/readiness; }
    #     location = /health/liveness { access_log off; proxy_pass http://backend_upstream/actuator/health/liveness; }
    #     location /api/ { proxy_pass http://backend_upstream; }
    #     location /actuator/ { return 404; }
    #     location /v3/api-docs { return 404; }
    #     location = /swagger-ui.html { return 404; }
    #     location ~ ^/(uploads|data|logs)(/|$) { return 404; }
    #     location ~ /\.(env|git) { return 404; }
    #     location ~* \.(ya?ml|properties|sql|log)$ { return 404; }
    #     location / { proxy_pass http://frontend_upstream; }
    # }
    #
    # When this listener is enabled, the plaintext listener above should redirect rather than
    # serve, otherwise the same content stays available over HTTP. Replace its location blocks
    # with:  location / { return 308 https://$host$request_uri; }
    # -----------------------------------------------------------------------
}
