# ---------------------------------------------------------------------------
# Nginx edge (specs/09-P0-Foundation-V1.5.md section 54).
#
# The edge owns exactly three concerns: frontend routing, API routing, and the
# transport-level request concerns (correlation, size limits, proxy headers).
# Business routing decisions deliberately do NOT live here, and no static
# mapping exposes uploads, application configuration, environment files,
# database files or logs (start section 55).
#
# Request flow:  client -> nginx -> {frontend:3000, backend:8080}
# PgBouncer is not on this path; it sits between the backend and PostgreSQL.
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access log; request_id is emitted by the application too, so an
    # edge log line and an application log line can be correlated.
    log_format structured escape=json
        '{"timestamp":"$time_iso8601","requestId":"$request_id_final","remoteAddr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"upstreamStatus":"$upstream_status","requestTime":$request_time,"bytes":$body_bytes_sent}';
    access_log /var/log/nginx/access.log structured;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Do not advertise the Nginx version.
    server_tokens off;

    # -----------------------------------------------------------------------
    # Request size limits (section 54). The application independently bounds an
    # upload (25 MB file / 30 MB request), so these are the outer envelope.
    # -----------------------------------------------------------------------
    client_max_body_size 30m;
    client_body_buffer_size 128k;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # -----------------------------------------------------------------------
    # Request correlation (section 16).
    #
    # A caller-supplied X-Request-Id is propagated so a client can correlate its
    # own trace. When the client sends none, Nginx generates one. The value is
    # not trusted as a security identity by either tier: the application
    # re-validates it against a strictly bounded pattern and replaces it when it
    # does not match.
    # -----------------------------------------------------------------------
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    # -----------------------------------------------------------------------
    # Proxy defaults
    # -----------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-Id $request_id_final;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;

    # Baseline response hardening. A strict Content-Security-Policy belongs to the
    # hardening phase (tracked as GAP-137) because it must be tuned against the
    # KaTeX/Markdown rendering boundary first.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    upstream backend_upstream {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------- edge liveness
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---------------------------------------------------------------- backend health
        # The readiness route the verification script uses. It is intentionally the
        # only actuator surface reachable through the edge: metrics and the wider
        # actuator tree stay internal (see the deny block below).
        location = /health {
            access_log off;
            proxy_pass http://backend_upstream/actuator/health;
        }

        location = /health/readiness {
            access_log off;
            proxy_pass http://backend_upstream/actuator/health/readiness;
        }

        location = /health/liveness {
            access_log off;
            proxy_pass http://backend_upstream/actuator/health/liveness;
        }

        # ---------------------------------------------------------------- API routing
        # The path is preserved, so /api/v1/... reaches the identical route on the
        # backend and the API contract is untouched.
        location /api/ {
            proxy_pass http://backend_upstream;
        }

        # ---------------------------------------------------------------- not exposed
        # Nginx never becomes a second, unchecked door into the application
        # (section 55). These return 404 rather than proxying.
        location /actuator/ {
            return 404;
        }

        location /v3/api-docs {
            return 404;
        }

        location = /swagger-ui.html {
            return 404;
        }

        # No static mapping may expose uploads, application configuration, or logs.
        location ~ ^/(uploads|data|logs)(/|$) {
            return 404;
        }

        location ~ /\.(env|git) {
            return 404;
        }

        location ~* \.(ya?ml|properties|sql|log)$ {
            return 404;
        }

        # ---------------------------------------------------------------- frontend routing
        location / {
            proxy_pass http://frontend_upstream;
        }
    }

    # -----------------------------------------------------------------------
    # TLS placeholders (section 54 / P0-10).
    #
    # TLS is a hard requirement for production, but the platform must not ship a
    # private key, and Nginx refuses to start when a configured certificate is
    # absent. This block is therefore inert until an operator mounts a real
    # certificate pair at infrastructure/nginx/certs/{tls.crt,tls.key} and
    # enables it. See infrastructure/nginx/certs/README.md.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/tls.crt;
    #     ssl_certificate_key /etc/nginx/certs/tls.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\\n"; }
    #     location = /health { access_log off; proxy_pass http://backend_upstream/actuator/health; }
    #     location /api/ { proxy_pass http://backend_upstream; }
    #     location / { proxy_pass http://frontend_upstream; }
    # }
    # -----------------------------------------------------------------------
}
