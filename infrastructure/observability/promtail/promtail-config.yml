# ---------------------------------------------------------------------------
# Promtail configuration (P0-11 / GAP-087).
#
# Ships container stdout/stderr into Loki and labels each stream with its Compose
# service, so edge, API and worker logs land in one place.
#
# Note: discovery of /var/lib/docker/containers is host-dependent. It works on
# Linux; Docker Desktop for Windows/macOS keeps container logs inside its VM, so
# on those hosts this service is optional and the application's structured logs
# remain available through `docker compose logs`.
# ---------------------------------------------------------------------------
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
    pipeline_stages:
      # Application logs are already JSON (logstash encoder); lift the
      # correlation id into a label so a Grafana trace can filter on it.
      - json:
          expressions:
            level: level
            logger: logger_name
            requestId: requestId
      - labels:
          level:
          logger:
