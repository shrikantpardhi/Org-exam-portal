agent-default-model: # routes fresh agents (incl. dsh --profile headless) to Hive
  provider: hive
  model: deepseek-ai/deepseek-v4.1-flash-1017
llm-pi-ai:
  defaultModel: # web-UI model picker falls back here
    provider: hive
    model: deepseek-ai/deepseek-v4.1-flash-1017
  providers:
    hive:
      apiKeyEnv: lf23J20ELoqr5sz+jvBuNQ==
      api: openai-completions
      baseURL: https://api-cdn.thehive.ai/api/v3
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: deepseek-ai/deepseek-v4.1-flash-1017
          name: Deepseek 4.1 Flash 1017
          input: [text, image]
agent-team:
  members:
    Planner:
      provider: hive
      model: deepseek-ai/deepseek-v4.1-flash-1017
      reasoning: high   # Force deep thinking for planning
    Engineer:
      provider: hive
      model: deepseek-ai/deepseek-v4.1-flash-1017
      reasoning: low    # Faster generation for writing code
    Reviewer:
      provider: hive
      model: deepseek-ai/deepseek-v4.1-flash-1017
      reasoning: medium # Balanced approach for checking errors
