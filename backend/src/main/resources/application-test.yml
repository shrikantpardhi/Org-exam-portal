# Test profile.
# The datasource is supplied at runtime by the test harness (an embedded, disposable
# PostgreSQL instance) - see docs/decisions/ADR-0009-integration-test-datastore.md.
# The placeholder below is only a fallback and is overridden by @DynamicPropertySource.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/exam_platform_test
    username: postgres
    password: postgres
  jpa:
    properties:
      # Counts the statements Hibernate prepares so tests can assert a bounded query count
      # (GAP-156). Inspecting statements does not alter them and costs nothing measurable.
      hibernate.session_factory.statement_inspector: com.company.exam.support.QueryCountInspector
  data:
    redis:
      host: localhost
      # Deliberately unreachable: tests assert graceful cache degradation.
      port: 6399

app:
  environment: test
  security:
    jwt:
      secret: ${JWT_SECRET:test-only-secret-value-at-least-32-characters-long}
  content:
    # Keep test asset uploads out of the working tree.
    asset-storage-root: ${java.io.tmpdir}/exam-platform-test-assets
  delivery:
    # The snapshot worker is disabled in tests; preparation is invoked explicitly and deterministically.
    worker:
      enabled: false
  evaluation:
    # Keep test scorecard artifacts out of the working tree.
    scorecard-root: ${java.io.tmpdir}/exam-platform-test-scorecards
    worker:
      enabled: false
  analytics:
    # Analytics refresh/rebuild is invoked explicitly and deterministically in tests.
    worker:
      enabled: false
  commerce:
    # The deterministic reference gateway; the same secret is used by test callback signatures.
    gateway: TEST
    gateway-secret: commerce-test-gateway-secret
  communication:
    # The deterministic fake email provider; communication workers run explicitly in tests.
    provider: FAKE
    worker:
      enabled: false
  reporting:
    # Artifacts are written under the build output so a test run never pollutes the working tree.
    artifact-root: target/test-reports
    download-signing-key: reporting-test-key
    # The report worker is invoked explicitly and deterministically in tests.
    worker:
      enabled: false

logging:
  level:
    root: WARN
    com.company.exam: INFO
