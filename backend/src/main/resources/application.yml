# ---------------------------------------------------------------------------
# Base configuration shared by all environments.
# Environment-specific values live in application-{profile}.yml and come from
# environment variables. Secrets are never committed (specs/09-… §107).
# ---------------------------------------------------------------------------
spring:
  application:
    name: exam-platform-backend
  profiles:
    default: local
  autoconfigure:
    # P0 has no user store. Without this exclusion Spring Boot creates an inert in-memory
    # default user and logs a generated password, which is an implicit credential we do not
    # want. P1 Identity provides the real UserDetailsService.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    # Spring Boot 4 uses Jackson 3. Nulls are omitted so the standard envelopes keep
    # their documented shape; instants serialize as ISO-8601 by default.
    default-property-inclusion: non_null
    time-zone: UTC
    deserialization:
      # Do not silently accept malformed client data (specs/09-… §17).
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:30MB}
  lifecycle:
    # Graceful shutdown (specs/09-… §119).
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  max-http-request-header-size: 16KB

app:
  environment: ${APP_ENVIRONMENT:local}
  info:
    version: "@project.version@"
  security:
    jwt:
      issuer: ${JWT_ISSUER:exam-platform}
      # Empty default fails fast with a clear validation message if not configured.
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    session:
      # Absolute login-session lifetime; older ACTIVE sessions become EXPIRED (specs/10-P1 §41).
      absolute-lifetime: ${SESSION_ABSOLUTE_LIFETIME:PT12H}
      expiry-sweep-interval: ${SESSION_EXPIRY_SWEEP_INTERVAL:PT5M}
      expiry-sweep-initial-delay: ${SESSION_EXPIRY_SWEEP_INITIAL_DELAY:PT1M}
    # Trust X-Forwarded-For only behind the trusted edge; default false (specs/10-P1 §46).
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cache:
    key-prefix: "exam:"
    default-ttl: PT10M
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data/uploads}
    max-file-size: ${APP_MAX_UPLOAD_SIZE:25MB}
    allowed-content-types:
      - image/png
      - image/jpeg
      - application/pdf
  worker:
    scheduler-pool-size: 4
    shutdown-await-seconds: 20

  content:
    # Canonical content and asset limits (specs/12-P3-Content-V1.5.md §60).
    max-content-length: ${CONTENT_MAX_LENGTH:100000}
    max-asset-size-bytes: ${CONTENT_MAX_ASSET_BYTES:5000000}
    asset-storage-root: ${CONTENT_ASSET_ROOT:./data/content-assets}

  delivery:
    # Asynchronous snapshot preparation worker (specs/14-P5-Delivery-V1.5.md §101-§103).
    worker:
      enabled: ${DELIVERY_WORKER_ENABLED:true}
      batch-size: ${DELIVERY_WORKER_BATCH_SIZE:50}
      interval: ${DELIVERY_WORKER_INTERVAL:PT30S}
      initial-delay: ${DELIVERY_WORKER_INITIAL_DELAY:PT15S}
      stale-timeout: ${DELIVERY_WORKER_STALE_TIMEOUT:PT5M}

  evaluation:
    # Scorecard artifacts are written outside the scoring transaction (§84, §61).
    scorecard-root: ${EVALUATION_SCORECARD_ROOT:./data/scorecards}
    # The asynchronous evaluation worker is disabled by default: the P5 handoff carries no explicit
    # answer key and §26 forbids defaulting to one (see GAP-071).
    worker:
      enabled: ${EVALUATION_WORKER_ENABLED:false}
      batch-size: ${EVALUATION_WORKER_BATCH_SIZE:50}
      interval: ${EVALUATION_WORKER_INTERVAL:PT30S}
      initial-delay: ${EVALUATION_WORKER_INITIAL_DELAY:PT15S}

  analytics:
    # Derived, recalculable aggregates (specs/17-P8-Analytics-V1.5.md).
    active-user-window: ${ANALYTICS_ACTIVE_USER_WINDOW:P30D}
    stale-after: ${ANALYTICS_STALE_AFTER:PT15M}
    average-time-upper-bound-seconds: ${ANALYTICS_TIME_UPPER_BOUND:86400}
    weak-area-accuracy-threshold: ${ANALYTICS_WEAK_AREA_THRESHOLD:50.0}
    minimum-sample-size: ${ANALYTICS_MIN_SAMPLE_SIZE:5}
    calculation-version: ${ANALYTICS_CALC_VERSION:p8-1}
    worker:
      enabled: ${ANALYTICS_WORKER_ENABLED:true}
      batch-size: ${ANALYTICS_WORKER_BATCH_SIZE:25}
      interval: ${ANALYTICS_WORKER_INTERVAL:PT30S}
      initial-delay: ${ANALYTICS_WORKER_INITIAL_DELAY:PT20S}

  commerce:
    # The single platform currency and pricing calculation version (specs/18-P9-Commerce-V1.5.md §15.2).
    currency: ${COMMERCE_CURRENCY:INR}
    calculation-version: ${COMMERCE_CALC_VERSION:p9-1}
    # Only the reference test gateway ships with the platform; a real provider is a separate adapter.
    gateway: ${COMMERCE_GATEWAY:TEST}
    # Callback signature secret. Never persisted in a domain table; supply from the environment in a real deployment.
    gateway-secret: ${COMMERCE_GATEWAY_SECRET:commerce-test-gateway-secret}
    checkout-enabled: ${COMMERCE_CHECKOUT_ENABLED:false}

  communication:
    # Only the reference fake email provider ships with the platform (specs/19-P10 §29, §86).
    provider: ${COMMUNICATION_PROVIDER:FAKE}
    # Bounded retry with exponential backoff + jitter and a cap (specs/19-P10 §33, §35).
    max-attempts: ${COMMUNICATION_MAX_ATTEMPTS:5}
    backoff-base: ${COMMUNICATION_BACKOFF_BASE:PT1M}
    backoff-multiplier: ${COMMUNICATION_BACKOFF_MULTIPLIER:5.0}
    backoff-cap: ${COMMUNICATION_BACKOFF_CAP:PT30M}
    backoff-jitter: ${COMMUNICATION_BACKOFF_JITTER:0.20}
    fanout-batch-size: ${COMMUNICATION_FANOUT_BATCH_SIZE:500}
    worker-batch-size: ${COMMUNICATION_WORKER_BATCH_SIZE:50}
    worker:
      enabled: ${COMMUNICATION_WORKER_ENABLED:true}
      interval: ${COMMUNICATION_WORKER_INTERVAL:PT15S}
      initial-delay: ${COMMUNICATION_WORKER_INITIAL_DELAY:PT20S}

  reporting:
    # Protected artifact store; files are written per job under this root (specs/22-P13 §21-§23, §32).
    artifact-root: ${REPORTING_ARTIFACT_ROOT:./data/reports}
    # Short-lived, artifact-scoped download token (§23).
    download-token-lifetime: ${REPORTING_DOWNLOAD_TOKEN_LIFETIME:PT15M}
    download-signing-key: ${REPORTING_DOWNLOAD_SIGNING_KEY:}
    # Maximum report interval (specs/22-P13 §16).
    max-interval: ${REPORTING_MAX_INTERVAL:P366D}
    # The report worker is deliberately slower and smaller than exam-critical workers (§94).
    worker:
      enabled: ${REPORTING_WORKER_ENABLED:true}
      batch-size: ${REPORTING_WORKER_BATCH_SIZE:5}
      interval: ${REPORTING_WORKER_INTERVAL:PT60S}
      initial-delay: ${REPORTING_WORKER_INITIAL_DELAY:PT45S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Component statuses are visible; component details stay hidden to avoid
      # exposing infrastructure configuration on a public endpoint (specs/09-… §37).
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.company.exam: INFO
  structured:
    # JSON console logs for the Loki pipeline; includes MDC (requestId).
    format:
      console: logstash
