# Staging profile (production-like).
#   application -> PgBouncer -> PostgreSQL   (specs/09-… §18, §27)
spring:
  datasource:
    url: jdbc:postgresql://${PGBOUNCER_HOST:pgbouncer}:${PGBOUNCER_PORT:6432}/${POSTGRES_DB:exam_platform}
    username: ${POSTGRES_USER:exam_app}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # HikariCP's connection-timeout is a LONG in milliseconds, not a duration
      # string ("5s" fails to bind and aborts the context at start-up).
      connection-timeout: 5000
      pool-name: exam-app-pool

app:
  environment: staging
  security:
    exposure:
      # Staging keeps the API documentation and Swagger UI. It is not a public surface, and the
      # `staging` profile is what the local Docker stack runs, so disabling the docs here would
      # remove a developer affordance the hardening constraints require us to preserve.
      #
      # This is safe because the gate is not this flag: SecurityExposurePolicy also refuses
      # production whenever an active `prod`/`production` profile is present, which is the case
      # that actually matters. Note that APP_ENVIRONMENT overrides this value in the container
      # environment, so a process running the prod profile with APP_ENVIRONMENT=staging arrives
      # here while still being refused by the policy.
      api-docs-enabled: true

logging:
  level:
    com.company.exam: INFO
