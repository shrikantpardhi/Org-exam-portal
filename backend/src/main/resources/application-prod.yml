# Production profile.
#   application -> PgBouncer -> PostgreSQL   (specs/09-… §18, §27)
# Secrets come from the environment/secret manager and have no defaults here.
spring:
  datasource:
    url: jdbc:postgresql://${PGBOUNCER_HOST}:${PGBOUNCER_PORT:6432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # HikariCP's connection-timeout is a LONG in milliseconds, not a duration
      # string ("5s" fails to bind and aborts the context at start-up).
      connection-timeout: 5000
      pool-name: exam-app-pool

# API documentation is not published in production (GAP-136, specs/21-P12 §26). Both the
# document endpoint and the UI are disabled so springdoc does not even build the model, and
# SecurityConfig additionally refuses the paths if this is ever overridden.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  environment: production
  security:
    exposure:
      api-docs-enabled: false

logging:
  level:
    root: WARN
    com.company.exam: INFO
